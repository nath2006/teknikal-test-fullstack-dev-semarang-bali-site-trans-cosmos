openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
paths:
  /auth/login:
    post:
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: JWT token response }
  /auth/logout:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Logged out }
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user }
  /tasks:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [todo, in_progress, review, done] }
        - in: query
          name: priority
          schema: { type: string, enum: [low, medium, high, urgent] }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200': { description: Paginated tasks }
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created task }
  /tasks/{id}:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Task detail }
    put:
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Updated task }
    delete:
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted task }
  /tasks/{id}/attachments:
    post:
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Uploaded attachment }
  /attachments/{id}/download:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        '200': { description: File download }
  /attachments/{id}:
    delete:
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Deleted attachment }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  /users:
    get:
      security: [{ bearerAuth: [] }]
      summary: List users (Admin only)
      responses:
        '200':
          description: Users list

    post:
      security: [{ bearerAuth: [] }]
      summary: Create user (Admin only)
      responses:
        '201':
          description: User created

  /users/{id}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Get user detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: User detail

    put:
      security: [{ bearerAuth: [] }]
      summary: Update user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: User updated

    delete:
      security: [{ bearerAuth: [] }]
      summary: Delete user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: User deleted
